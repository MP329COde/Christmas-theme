<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Scene Lab — ChristmasTree</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* The lab gives the transparent renderer something to composite over,
     standing in for the desktop wallpaper it sits on in the real app.
     ?bg=none strips it, to check the overlay's own transparency. */
  body.wallpaper {
    background:
      radial-gradient(120% 90% at 50% 120%, #16283b 0%, #0a1421 45%, #050a12 100%);
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe3ff; background: rgba(6,12,20,0.66);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 8px 11px; white-space: pre; pointer-events: none;
  }
  #hud.hidden { display: none; }
</style>
</head>
<body class="wallpaper">
  <canvas id="scene"></canvas>
  <div id="hud">booting…</div>
  <script type="module" src="./lab.js"></script>
</body>
</html>
