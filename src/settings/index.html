<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Christmas Theme Settings</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎄 Christmas Theme</h1>
    <div class="preset-bar">
      <img id="preset-thumb" data-testid="preset-thumb" class="preset-thumb" alt="" hidden />
      <select id="preset-select" data-testid="preset-select" aria-label="Preset">
        <option value="">— Preset —</option>
      </select>
      <button id="preset-save" data-testid="preset-save" class="ghost" title="Save the current look as a preset">Save as…</button>
      <button id="preset-delete" data-testid="preset-delete" class="ghost" title="Delete the selected preset">Delete</button>
      <button id="preset-export" data-testid="preset-export" class="ghost" title="Export presets to a file">Export</button>
      <label class="ghost file" title="Import presets from a file">
        Import<input type="file" id="preset-import" data-testid="preset-import" accept="application/json" hidden />
      </label>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="scene" data-testid="tab-scene" role="tab" aria-selected="true">Scene</button>
    <button class="tab" data-tab="snow" data-testid="tab-snow" role="tab" aria-selected="false">Snow</button>
    <button class="tab" data-tab="lights" data-testid="tab-lights" role="tab" aria-selected="false">Lights</button>
    <button class="tab" data-tab="system" data-testid="tab-system" role="tab" aria-selected="false">System</button>
  </nav>

  <main>
    <section class="panel" id="panel-scene" data-testid="panel-scene"></section>
    <section class="panel" id="panel-snow" data-testid="panel-snow" hidden></section>
    <section class="panel" id="panel-lights" data-testid="panel-lights" hidden></section>
    <section class="panel" id="panel-system" data-testid="panel-system" hidden></section>
  </main>

  <footer>
    <button id="disable-btn" data-testid="disable-all" class="danger">Disable everything</button>
    <span id="status" data-testid="status" role="status"></span>
  </footer>

  <script type="module" src="./settings.js"></script>
</body>
</html>
