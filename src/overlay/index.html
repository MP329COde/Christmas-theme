<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Snow Overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* Three stacked transparent layers. The z-order IS the depth order of
     the scene: sky and far snow behind, the GPU-rendered trees in the
     middle, everything in front of them on top. */
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #snow       { z-index: 0; }
  #snow-gl    { z-index: 1; }
  #snow-front { z-index: 2; }
  /* Hidden until the engine has actually produced a frame, so a failed
     start never leaves an empty canvas sitting over the scene. */
  #snow-gl[hidden] { display: none; }
</style>
</head>
<body>
  <canvas id="snow"></canvas>
  <canvas id="snow-gl" hidden></canvas>
  <canvas id="snow-front"></canvas>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
