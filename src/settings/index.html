<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Christmas Theme Settings</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="panel">
    <h1>🎄 Christmas Theme</h1>

    <section>
      <label for="theme-select">Theme</label>
      <select id="theme-select" data-testid="theme-select"></select>
    </section>

    <h2>Snow</h2>

    <section>
      <label for="snow-density">Density <span id="snow-density-value">120</span></label>
      <input type="range" id="snow-density" data-testid="snow-density" min="0" max="300" step="10" />
    </section>

    <section>
      <label for="snow-wind">Wind <span id="snow-wind-value">30%</span></label>
      <input type="range" id="snow-wind" data-testid="snow-wind" min="0" max="100" step="5" />
    </section>

    <section>
      <label for="flake-scale">Flake size <span id="flake-scale-value">100%</span></label>
      <input type="range" id="flake-scale" data-testid="flake-scale" min="40" max="250" step="10" />
    </section>

    <section class="toggle-row">
      <label for="accumulate-toggle">Accumulate on ground</label>
      <input type="checkbox" id="accumulate-toggle" data-testid="accumulate-toggle" />
    </section>

    <section>
      <label for="max-snow-height">Max snow depth <span id="max-snow-height-value">60 px</span></label>
      <input type="range" id="max-snow-height" data-testid="max-snow-height" min="0" max="300" step="10" />
    </section>

    <h2>Decorations</h2>

    <section class="toggle-row">
      <label for="dock-toggle">Decorate Dock / Taskbar</label>
      <input type="checkbox" id="dock-toggle" data-testid="dock-toggle" />
    </section>

    <section class="toggle-row">
      <label for="trees-toggle">🎄 Christmas trees</label>
      <input type="checkbox" id="trees-toggle" data-testid="trees-toggle" />
    </section>

    <section class="toggle-row">
      <label for="garlands-toggle">✨ Light garland</label>
      <input type="checkbox" id="garlands-toggle" data-testid="garlands-toggle" />
    </section>

    <section>
      <label for="garland-style">Garland colors</label>
      <select id="garland-style" data-testid="garland-style">
        <option value="multicolor">Multicolor</option>
        <option value="warm">Warm white</option>
        <option value="cool">Cool blue</option>
      </select>
    </section>

    <section class="toggle-row">
      <label for="tree-lights-toggle">💡 String lights on trees</label>
      <input type="checkbox" id="tree-lights-toggle" data-testid="tree-lights-toggle" />
    </section>

    <section class="toggle-row">
      <label for="fireplace-toggle">🔥 Fireplace</label>
      <input type="checkbox" id="fireplace-toggle" data-testid="fireplace-toggle" />
    </section>

    <section class="toggle-row">
      <label for="stockings-toggle">🧦 Stockings on the mantel</label>
      <input type="checkbox" id="stockings-toggle" data-testid="stockings-toggle" />
    </section>

    <section class="toggle-row">
      <label for="mantel-garland-toggle">🌿 Pine swag on the mantel</label>
      <input type="checkbox" id="mantel-garland-toggle" data-testid="mantel-garland-toggle" />
    </section>

    <section>
      <label for="decor-scale">Decoration size <span id="decor-scale-value">100%</span></label>
      <input type="range" id="decor-scale" data-testid="decor-scale" min="50" max="200" step="10" />
    </section>

    <h2>Sound</h2>

    <section>
      <label for="volume">Ambient volume <span id="volume-value">40%</span></label>
      <input type="range" id="volume" data-testid="volume" min="0" max="100" step="5" />
    </section>

    <h2>Performance</h2>

    <section>
      <label for="fps-limit">Frame rate cap</label>
      <select id="fps-limit" data-testid="fps-limit">
        <option value="0">Unlimited (match display)</option>
        <option value="144">144 fps</option>
        <option value="120">120 fps</option>
        <option value="60">60 fps</option>
        <option value="30">30 fps (battery saver)</option>
      </select>
      <p class="hint" data-testid="fps-readout" id="fps-readout">Waiting for the overlay…</p>
    </section>

    <h2>System</h2>

    <section class="toggle-row">
      <label for="autostart-toggle">Start automatically with system</label>
      <input type="checkbox" id="autostart-toggle" data-testid="autostart-toggle" />
    </section>

    <footer>
      <button id="disable-btn" data-testid="disable-all" class="danger">Disable everything</button>
      <span id="status" data-testid="status" role="status"></span>
    </footer>
  </main>

  <script type="module" src="./settings.js"></script>
</body>
</html>
